<!DOCTYPE html>
{% load static %}
<html lang="ru">

<head>
    <link rel="stylesheet" href="{% static 'main/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'main/css/bootstrap-icons.css' %}" />
    <link rel="stylesheet" href="{% static 'main/css/select2.min.css' %}" />
    <link rel="stylesheet" href="{% static 'main/css/custom.css' %}" />
    <script src="{% static 'main/js/jquery.min.js' %}"></script>
    <script src="{% static 'main/js/bootstrap.js' %}"></script>
    <script src="{% static 'main/js/chart.umd.min.js' %}"></script>
    <script src="{% static 'main/js/chartjs-plugin-annotation.min.js' %}"></script>
    <script src="{% static 'main/js/select2.min.js' %}"></script>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock title %}</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" data-bs-theme="dark">
        <div class="container">
            <!-- Логотип/Бренд -->
            <a class="navbar-brand" href="{% url 'home' %}" style="font-size: 20px;">
                PF.ДФЗ
            </a>
            
            <!-- Кнопка-гамбургер для мобильных устройств -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
                aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarColor01">
                <!-- Основная навигация -->
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/calculation/' %}active{% endif %}"
                            href="{% url 'calculation' %}" style="font-size: 18px;">
                            <i class="bi bi-calculator"></i> РАСЧЕТ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/calculation/calculation_list/' %}active{% endif %}"
                            href="{% url 'calculation_list' %}" style="font-size: 18px;">
                            <i class="bi bi-clock-history"></i> ИСТОРИЯ
                        </a>
                    </li>
                </ul>
                
                <!-- Правая часть: Проект + Пользователь -->
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <!-- Компактный селектор проекта -->
                    <div class="d-flex align-items-center">
                        <form method="post" action="{% url 'calculation' %}" id="project-selection-form"
                            class="d-flex align-items-center">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="select_project">
                            <i class="bi bi-folder text-light me-1"></i>
                            <select name="project_name" id="pf-project-select" class="form-select form-select-sm"
                                style="width: 180px;">
                                <option value="">Проект не выбран</option>
                            </select>
                            <span id="project-status" class="ms-2" style="font-size: 14px;"></span>
                            <span id="project-warning-badge" class="ms-1" style="display: none;"></span>
                        </form>
                    </div>
                    
                    <!-- Меню пользователя -->
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button"
                            id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> 
                            <span>{{ user.username|default:"Пользователь" }}</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuDropdown">
                            {% if user.is_staff %}
                            <li>
                                <a class="dropdown-item" href="{% url 'admin:index' %}">
                                    <i class="bi bi-gear"></i> Админ панель
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            {% endif %}
                            <li>
                                <form method="post" action="{% url 'logout' %}" class="d-inline">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item">
                                        <i class="bi bi-box-arrow-right"></i> Выход
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <h1>{% block header %}{% endblock header %}</h1>
    <div>{% block content%}{% endblock content %}</div>

    <script>
        $(document).ready(function () {
            const projectSelect = $('#pf-project-select');
            const projectStatus = $('#project-status');
            const projectForm = $('#project-selection-form');

            // Функция для загрузки списка проектов
            function loadProjects() {
                $.ajax({
                    url: '{% url "get_available_projects_ajax" %}',
                    type: 'GET',
                    success: function (response) {
                        projectSelect.empty();
                        console.log('Response from server:', response);

                        // Проверяем наличие ошибки в ответе
                        if (response.error) {
                            let errorMsg = response.error;
                            if (response.error_type === 'ModuleNotFoundError') {
                                errorMsg = 'PowerFactory не запущен';
                            }
                            projectSelect.append('<option value="">Проект не выбран</option>');
                            updateProjectStatus(null, null);
                            showProjectWarning(errorMsg);
                            return;
                        }

                        if (response.projects && response.projects.length > 0) {
                            // Добавляем опцию "Проект не выбран" в начало списка
                            projectSelect.append('<option value="">Проект не выбран</option>');

                            response.projects.forEach(function (project) {
                                const option = $('<option></option>')
                                    .attr('value', project)
                                    .text(project);

                                // Выделяем текущий проект
                                if (project === response.current_project) {
                                    option.attr('selected', true);
                                }

                                projectSelect.append(option);
                            });

                            // Если проект не выбран, выбираем опцию "Проект не выбран"
                            if (!response.current_project) {
                                projectSelect.val('');
                            }

                            // Обновляем статус проекта
                            updateProjectStatus(response.current_project, response.project_available);
                            hideProjectWarning();
                        } else {
                            // Если нет проектов и нет ошибки - возможно PowerFactory не запущен или нет проектов
                            projectSelect.append('<option value="">Проект не выбран</option>');
                            updateProjectStatus(null, null);
                            showProjectWarning('Нет доступных проектов. Убедитесь, что PowerFactory запущен');
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('AJAX error:', xhr, status, error);
                        projectSelect.empty();
                        let errorMsg = 'Ошибка загрузки проектов';

                        if (xhr.responseJSON) {
                            console.log('Response JSON:', xhr.responseJSON);
                            if (xhr.responseJSON.error) {
                                errorMsg = xhr.responseJSON.error;
                            } else if (xhr.responseJSON.error_type === 'ModuleNotFoundError') {
                                errorMsg = 'PowerFactory не запущен';
                            }
                        } else if (xhr.status === 0) {
                            errorMsg = 'Не удалось подключиться к серверу';
                        } else if (xhr.status === 500) {
                            errorMsg = 'Ошибка сервера';
                        }

                        projectSelect.append('<option value="">Проект не выбран</option>');
                        updateProjectStatus(null, null);
                        showProjectWarning(errorMsg);
                    }
                });
            }

            // Функция для отображения badge с предупреждением
            function showProjectWarning(message) {
                const badge = $('#project-warning-badge');
                badge.html('<span class="badge bg-warning text-dark" title="' + message + '"><i class="bi bi-exclamation-triangle-fill"></i></span>');
                badge.show();
            }

            // Функция для скрытия badge с предупреждением
            function hideProjectWarning() {
                $('#project-warning-badge').hide();
            }

            // Функция для обновления статуса проекта
            function updateProjectStatus(projectName, isAvailable) {
                projectStatus.empty();

                if (!projectName) {
                    projectStatus.html('<span class="text-warning" title="Проект не выбран">●</span>');
                    return;
                }

                if (isAvailable === true) {
                    projectStatus.html('<i class="bi bi-circle-fill text-success" title="Проект доступен"></i>');
                } else if (isAvailable === false) {
                    projectStatus.html('<i class="bi bi-circle-fill text-danger" title="Проект недоступен"></i>');
                } else {
                    projectStatus.html('<span class="text-secondary" title="Статус неизвестен">●</span>');
                }
            }

            // Обработчик изменения проекта
            projectSelect.on('change', function () {
                const selectedValue = $(this).val();
                if (selectedValue) {
                    projectForm.submit();
                } else {
                    // Если выбран "Проект не выбран", очищаем сессию
                    // Можно добавить AJAX запрос для очистки сессии, если нужно
                    updateProjectStatus(null, null);
                }
            });

            // Загружаем проекты при загрузке страницы
            loadProjects();

            // Обновляем список проектов каждые 30 секунд
            setInterval(loadProjects, 30000);
        });
    </script>
</body>

</html>
